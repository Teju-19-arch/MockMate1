{% extends "base.html" %}
{% block title %}Log in · MockMate{% endblock %}
{% block shell_class %}shell{% endblock %}

{% block content %}
<div class="auth-shell">
  <span class="eyebrow">Welcome back</span>
  <h1 style="font-size:1.9rem;">Log in to MockMate</h1>

  <form method="POST">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>

  <p style="margin-top:20px; font-size:0.9rem; color:var(--text-dim);">
    New here? <a href="{{ url_for('register') }}" style="color:var(--brass); font-weight:600;">Create an account</a>
  </p>
</div>
{% endblock %}
